function pull(){
  if(!remoteOn||loginOpen)return Promise.resolve();
  return fetch(nodeUrl(null),{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('http '+r.status);
    return r.json();
  }).then(function(r){
    synced=true;
    if(sync!=='denied')setSync('ok');
    if(dirty||pushing)return;
    if(r===null){base=null;return;}
    var ns=fromRemote(r),changed=sig(ns)!==sig(S);
    S=ns;base=snap();
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    if(changed)render();
  }).catch(function(){setSync('err');});
}
function touch(){S.ex=false;S.u=Date.now();dirty=true;scheduleSave();}
function scheduleSave(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(!remoteOn||!canEdit())return;
  clearTimeout(pushT);pushT=setTimeout(push,600);
}
function push(){
  if(!remoteOn||!canEdit())return;
  if(!synced){clearTimeout(retryT);retryT=setTimeout(push,3000);return;}
  if(pushing){pushAgain=true;return;}
  pushing=true;
  var cur=snap();
  getToken().then(function(tok){
    var url=nodeUrl(tok);
    if(base===null){
      var lg={};
      S.log.forEach(function(e){lg[e.t]=e;});
      return fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({have:cur.have,list:cur.list,ex:cur.ex,log:lg})});
    }
    var p={};
    ALL.forEach(function(i){
      if(!!cur.have[i]!==!!base.have[i])p['have/'+i]=cur.have[i]?true:null;
      if(!!cur.list[i]!==!!base.list[i])p['list/'+i]=cur.list[i]?true:null;
    });
    S.log.forEach(function(e){if(!base.logKeys[e.t])p['log/'+e.t]=e;});
    if(cur.ex!==base.ex)p.ex=cur.ex;
    if(!Object.keys(p).length)return null;
    return fetch(url,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
  }).then(function(r){
    if(r&&!r.ok){var er=new Error('http');er.st=r.status;throw er;}
    base=cur;
    if(!pushAgain)dirty=false;
    setSync('ok');
  }).catch(function(e){
    if(e&&(e.st===401||e.st===403)){setSync('denied');}
    else{setSync('err');clearTimeout(retryT);retryT=setTimeout(push,8000);}
  }).then(function(){
    pushing=false;
    if(pushAgain){pushAgain=false;push();}
  });
}
function initSync(){
  if(!remoteOn){setSync('local');return;}
  pull();
  setInterval(function(){if(!document.hidden)pull();},10000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)pull();});
}

/* ---------- Utilidades ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hh(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
function uniq(a){var o={},r=[];a.forEach(function(x){if(!o[x]){o[x]=1;r.push(x);}});return r;}
function joinEs(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1];}
function dayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function slotNow(){var d=new Date(),h=d.getHours()+d.getMinutes()/60;return h<10.5?'d':h<15.5?'a':'c';}
function dateStr(){
  try{return new Intl.DateTimeFormat('es',{weekday:'long',day:'numeric',month:'long'}).format(new Date());}catch(e){return '';}
}
function lastItems(n){var o={};S.log.slice(-n).forEach(function(e){(e.it||[]).forEach(function(i){o[i]=1;});});return o;}
function metReq(req,have){
  var unmet=[],used=[];
  req.forEach(function(q){
    if(Array.isArray(q)){
      var f=q.filter(function(i){return have[i];});
      if(f.length)used=used.concat(f.slice(0,2));else unmet.push(q);
    }else if(have[q])used.push(q);else unmet.push(q);
  });
  return {unmet:unmet,used:used};
}
function sidesOf(H){
  var out=[],sl=SALAD.filter(function(i){return H[i];});
  if(sl.length){var two=sl.slice(0,2);out.push({n:'ensalada de '+two.map(function(i){return NAME[i].toLowerCase();}).join(' y '),ids:two});}
  if(H.platano_verde)out.push({n:'tostones',ids:['platano_verde']});
  if(H.platano_maduro)out.push({n:'maduros fritos',ids:['platano_maduro']});
  if(H.yuca)out.push({n:'yuca hervida',ids:['yuca']});
  if(H.batata)out.push({n:'batata asada',ids:['batata']});
  if(H.aguacate)out.push({n:'aguacate',ids:['aguacate']});

}
function countPlates(H){
  if(!H.arroz)return 0;
  var M=MEN.filter(function(m){return H[m[0]];}),P=PRO.filter(function(p){return H[p[0]];});
  if(!M.length&&!P.length)return 0;
  return Math.max(1,M.length)*Math.max(1,P.length)*Math.max(1,sidesOf(H).length);
}
function scoreOf(name,items,sl,kind,extra,last2,recNames){
  var s=10+extra*0.6;
  items.forEach(function(i){s+=PER[i]*1.2;if(i!=='arroz'&&last2[i])s-=1.5;});
  if(recNames.indexOf(name)>=0)s-=12;
  if(kind==='r')s+=sl==='a'?0:2;else s+=sl==='a'?3:-1;
  s+=(hh(dayKey()+name)%300)/100;
  return s;
}
function buildPlates(sl,last2,recNames){
  var H=S.have,list=[];
  if(!H.arroz)return {n:0,list:list};
  var M=MEN.filter(function(m){return H[m[0]];}),P=PRO.filter(function(p){return H[p[0]];}),SD=sidesOf(H);
  if(!M.length&&!P.length)return {n:0,list:list};
  var Ms=M.length?M:[null],Ps=P.length?P:[null],Ss=SD.length?SD:[null];
  Ms.forEach(function(m){Ps.forEach(function(p){Ss.forEach(function(sd){
    var parts=[m&&m[1],p&&p[1],sd&&sd.n].filter(Boolean);
    var name='Arroz con '+joinEs(parts);
    var items=['arroz'];
    if(m)items.push(m[0]);if(p)items.push(p[0]);if(sd)items=items.concat(sd.ids);
    var sc=scoreOf(name,items,sl,'p',0,last2,recNames);
    if(m&&p&&(m[0]==='hab_rojas'||m[0]==='hab_negras')&&['pollo','res','cerdo','pescado'].indexOf(p[0])>=0)sc+=2;
    list.push({k:'p:'+name,kind:'p',name:name,items:items,tip:'Guisa la proteína con sazón y cebolla y sirve cada parte por separado.',fam:p?p[0]:'-',score:sc});
  });});});
  list.sort(function(a,b){return b.score-a.score;});
  return {n:list.length,list:list};
}
function slotData(sl){
  var ready=[],near=[],last2=lastItems(2),recNames=S.log.slice(-4).map(function(e){return e.n;});
  RECIPES.forEach(function(r){
    if(r.s.indexOf(sl)<0)return;
    var m=metReq(r.r,S.have),opt=r.o.filter(function(i){return S.have[i];}),items=uniq(m.used.concat(opt));
    if(!m.unmet.length)ready.push({k:'r:'+r.n,kind:'r',name:r.n,items:items,tip:r.t,fam:r.n,score:scoreOf(r.n,items,sl,'r',opt.length,last2,recNames)});
    else if(m.unmet.length===1)near.push({name:r.n,items:items,miss:m.unmet[0]});
  });
  var pl=sl==='d'?{n:0,list:[]}:buildPlates(sl,last2,recNames);
  var cand=ready.concat(pl.list).sort(function(a,b){return b.score-a.score;});
  near.sort(function(a,b){return b.items.length-a.items.length;});
  return {ready:ready,near:near.slice(0,6),plates:pl,cand:cand};
}
function gains(){
  var rc={},out=[],base=countPlates(S.have);
  RECIPES.forEach(function(r){
    var m=metReq(r.r,S.have);
    if(m.unmet.length===1){var q=m.unmet[0];(Array.isArray(q)?q:[q]).forEach(function(i){rc[i]=(rc[i]||0)+1;});}
  });
  ALL.forEach(function(id){
    if(S.have[id])return;
    var h2=Object.assign({},S.have);h2[id]=true;
    var pc=countPlates(h2)-base,r=rc[id]||0;
    if(r||pc>0)out.push({id:id,r:r,pc:pc});
  });
  out.sort(function(a,b){return (b.r*3+b.pc)-(a.r*3+a.pc);});
  return out.slice(0,12);
}

    h+='<div class="rows">'+ids.map(function(i){return '<div class="row"><span class="t">'+esc(NAME[i])+'</span><button class="btn small" data-act="list" data-id="'+i+'">Quitar</button></div>';}).join('')+'</div>';
  }else h+='<p class="muted">La lista está vacía. Agrega de lo que sugiere abajo, o lo que se acabe al cocinar entra solo.</p>';
  h+='<div class="btnrow"><button class="btn primary"'+(ids.length?'':' disabled')+' data-act="arrived">Llegó la compra</button><button class="btn"'+(ids.length?'':' disabled')+' data-act="copy">Copiar lista</button></div>';
  if(copyMsg)h+='<p class="muted">'+esc(copyMsg)+'</p>';
  if(copyText)h+='<textarea class="copybox" readonly id="copybox">'+esc(copyText)+'</textarea>';
  h+='</section>';
  var g=gains();
  h+='<section class="block"><h2>Qué comprar primero</h2><p class="muted">Ordenado por cuántos platos nuevos se pueden hacer con cada cosa.</p>';
  if(g.length){
    h+='<div class="rows">'+g.map(function(x){
      var s=[];if(x.r)s.push('+'+x.r+(x.r===1?' receta':' recetas'));if(x.pc>0)s.push('+'+x.pc+' combinaciones');
      return '<div class="row"><span class="t">'+esc(NAME[x.id])+'</span><span class="s">'+s.join(' · ')+'</span><button class="btn small" data-act="list" data-id="'+x.id+'">'+(S.list[x.id]?'En la lista':'A la lista')+'</button></div>';
    }).join('')+'</div>';
  }else h+='<p class="muted">Con lo que hay ya se cubre casi todo. Cuando algo falte, aparece aquí.</p>';
  h+='</section>';
  var rest=ALL.filter(function(i){return !S.have[i]&&!S.list[i];});
  if(rest.length)h+='<details class="more"><summary>Agregar otra cosa a la lista</summary><div class="chips" style="margin-top:.6rem">'+rest.map(function(i){return '<button class="chip" data-act="list" data-id="'+i+'">+ '+esc(NAME[i])+'</button>';}).join('')+'</div></details>';
  return h;
}
function sheetHtml(){
  var any=Object.keys(sheet.sel).some(function(k){return sheet.sel[k];});
  return '<div class="scrim" data-act="sheetCancel"><div class="sheet" role="dialog" aria-modal="true" aria-label="Qué se acabó"><h2>¿Se acabó algo?</h2><p class="muted">Lo que marques sale de la despensa y pasa a la lista de compra.</p><div class="chips">'+sheet.items.map(function(i){
    return '<button class="chip pick" data-act="sheetToggle" data-id="'+i+'" aria-pressed="'+!!sheet.sel[i]+'">'+esc(NAME[i])+(sheet.sel[i]?' · se acabó':'')+'</button>';
  }).join('')+'</div><div class="btnrow"><button class="btn primary" data-act="sheetDone">'+(any?'Anotar y actualizar':'Nada se acabó, anotar')+'</button><button class="btn" data-act="sheetCancel">Cancelar</button></div></div></div>';
}
function loginHtml(){
  return '<div class="scrim" data-act="loginCancel"><div class="sheet" role="dialog" aria-modal="true" aria-label="Entrar para editar"><h2>Entrar para editar</h2><p class="muted">Escribe la clave de la familia. Queda guardada en este aparato.</p><form id="loginform"><div class="block"><input class="field" id="clave" type="password" autocomplete="current-password" placeholder="Clave"><p class="muted" id="loginmsg"></p><div class="btnrow"><button class="btn primary" type="submit">Entrar</button><button class="btn" type="button" data-act="loginCancel">Cancelar</button></div></div></form></div></div>';
}
function themeMode(){try{return localStorage.getItem(TKEY)||'auto';}catch(e){return 'auto';}}
function applyTheme(){
  var m=themeMode(),r=document.documentElement;
  if(m==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',m);
}
function build(){
  var body=view==='hoy'?hoy():view==='despensa'?despensa():compra();
  var tl={auto:'automático',light:'claro',dark:'oscuro'}[themeMode()];
  var acc=remoteOn?(canEdit()?'<button class="link" data-act="logout">Salir de edición</button>':'<button class="link" data-act="login">Entrar para editar</button>'):'';
  return '<div class="wrap">'+nav()+body+'<footer class="foot"><span id="sync">'+syncLabel()+'</span><span>'+acc+'<button class="link" data-act="theme">Tema: '+tl+'</button></span></footer></div>'+(sheet?sheetHtml():'')+(loginOpen?loginHtml():'');
}
function render(){
  var y=window.pageYOffset||0,ae=document.activeElement,fk=ae&&ae.dataset?ae.dataset.fk:null;
  app.innerHTML=build();
  window.scrollTo(0,y);
  if(fk){var el=app.querySelector('[data-fk="'+fk+'"]');if(el)el.focus({preventScroll:true});}
}

/* ---------- Acciones ---------- */
function finishCook(){
  var sel=sheet.sel;
  S.log.push({n:sheet.name,it:sheet.items,s:sheet.slot,t:Date.now()});
  S.log=S.log.slice(-40);
  Object.keys(sel).forEach(function(i){if(sel[i]){S.have[i]=false;S.list[i]=true;}});
  touch();sheet=null;heroIdx=0;pick=null;
}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b)return;
  var act=b.dataset.act,id=b.dataset.id;
  if((act==='sheetCancel'||act==='loginCancel')&&b.classList.contains('scrim')&&e.target!==b)return;
  var W={tile:1,list:1,arrived:1,cook:1,reset:1,dismissEx:1};
  if(W[act]&&!canEdit()){loginOpen=true;render();var ci=document.getElementById('clave');if(ci)ci.focus();return;}
  switch(act){
    case 'view':view=b.dataset.v;copyMsg='';copyText='';window.scrollTo(0,0);break;
    case 'slot':slot=b.dataset.s;manualSlot=true;heroIdx=0;pick=null;break;
    case 'pick':pick=b.dataset.k;window.scrollTo(0,0);break;
    case 'other':pick=null;heroIdx++;break;
    case 'goDesp':view='despensa';window.scrollTo(0,0);break;
    case 'goCompra':view='compra';window.scrollTo(0,0);break;
    case 'dismissEx':touch();break;
    case 'cook':{
      var d=slotData(slot),hero=null;
      if(pick)hero=d.cand.filter(function(c){return c.k===pick;})[0]||null;
      if(!hero&&d.cand.length){var top=d.cand.slice(0,12);hero=top[heroIdx%top.length];}
      if(hero)sheet={name:hero.name,items:hero.items,slot:slot,sel:{}};
      break;
    }
    case 'sheetToggle':sheet.sel[id]=!sheet.sel[id];break;
    case 'sheetDone':finishCook();break;
    case 'sheetCancel':sheet=null;break;
    case 'tile':S.have[id]=!S.have[id];if(S.have[id])delete S.list[id];touch();break;
    case 'list':if(S.list[id])delete S.list[id];else S.list[id]=true;touch();break;
    case 'arrived':Object.keys(S.list).forEach(function(i){S.have[i]=true;});S.list={};touch();copyMsg='';copyText='';break;
    case 'copy':{
      var txt=ALL.filter(function(i){return S.list[i];}).map(function(i){return '- '+NAME[i];}).join('\n');
      copyText='';copyMsg='';
      var done=function(ok){copyMsg=ok?'Lista copiada.':'No se pudo copiar. Selecciona el texto de abajo.';copyText=ok?'':txt;render();};
      try{navigator.clipboard.writeText(txt).then(function(){done(true);},function(){done(false);});}catch(err){done(false);}
      return;
    }
    case 'reset':
      if(!resetArmed){resetArmed=true;setTimeout(function(){resetArmed=false;render();},3500);}
      else{S.have={};S.list={};touch();resetArmed=false;}
      break;
    case 'login':loginOpen=true;render();var ci2=document.getElementById('clave');if(ci2)ci2.focus();return;
    case 'loginCancel':loginOpen=false;break;
    case 'logout':saveRef(null);AUTH.tok=null;break;
    case 'theme':{
      var m=themeMode(),nx=m==='auto'?'light':m==='light'?'dark':'auto';
      try{localStorage.setItem(TKEY,nx);}catch(err){}
      applyTheme();break;
    }
  }
  render();
});
app.addEventListener('toggle',function(e){if(e.target&&e.target.id==='combos')openCombos=e.target.open;},true);
app.addEventListener('submit',function(e){
  e.preventDefault();
  var inp=document.getElementById('clave'),msg=document.getElementById('loginmsg');
  if(!inp||!inp.value)return;
  if(msg)msg.textContent='Entrando…';
  login(inp.value).then(function(){loginOpen=false;setSync('ok');render();pull();},function(){var m=document.getElementById('loginmsg');if(m)m.textContent='Clave incorrecta o sin conexión.';});
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(sheet||loginOpen)){sheet=null;loginOpen=false;render();}});
setInterval(function(){
  if(!manualSlot){var s=slotNow();if(s!==slot){slot=s;heroIdx=0;pick=null;render();}}
},60000);

applyTheme();
render();
initSync();
})();
</script>
</body>
</html>
